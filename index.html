<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hustle Shooters</title><style>body{margin:0;background:#0a0a1a;color:#fff;text-align:center;overflow:hidden}canvas{background:#111;display:block;margin:auto;border:2px solid #0ff}#ui{position:absolute;top:10px;left:10px;color:#0ff;font-weight:bold}button{padding:12px 25px;background:#0ff;border:none;font-weight:bold;border-radius:8px}#menu{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#000e;padding:20px;border-radius:15px;border:2px solid #0ff;width:80%}</style></head><body><div id="ui">SCORE:<span id="s">0</span>|WAVE:<span id="w">1</span></div><canvas id="c" width="400" height="600"></canvas><div id="menu"><h2>🚀 HUSTLE SHOOTERS<br>UNLIMITED LEVELS</h2><button onclick="start()">START GAME</button></div><script>let C=document.getElementById('c'),X=C.getContext('2d'),S=0,W=1,P={x:180,y:550,w:40,h:20},B=[],E=[],G=false;function start(){document.getElementById('menu').style.display='none';G=true;S=0;W=1;B=[];E=[];loop();spawn()}C.addEventListener('touchmove',e=>P.x=e.touches[0].clientX-20);setInterval(()=>{if(G)B.push({x:P.x+18,y:P.y,w:4,h:10})},200);function spawn(){if(!G)return;E.push({x:Math.random()*360,y:-40,w:30,h:30,s:1.5+W*0.4});if(S>W*100){W++;document.getElementById('w').innerText=W}setTimeout(spawn,800-Math.min(W*50,600))}function loop(){if(!G)return;X.clearRect(0,0,400,600);X.fillStyle='#0ff';X.fillRect(P.x,P.y,P.w,P.h);X.fillStyle='#ff0';B.forEach((b,i)=>{b.y-=7;X.fillRect(b.x,b.y,b.w,b.h);if(b.y<0)B.splice(i,1)});X.fillStyle='#f00';E.forEach((e,ei)=>{e.y+=e.s;X.fillRect(e.x,e.y,e.w,e.h);B.forEach((b,bi)=>{if(b.x<e.x+e.w&&b.x+b.w>e.x&&b.y<e.y+e.h&&b.y+b.h>e.y){E.splice(ei,1);B.splice(bi,1);S+=10;document.getElementById('s').innerText=S}});if(e.y>600){G=false;document.getElementById('menu').style.display='block';document.getElementById('menu').innerHTML='<h2>GAME OVER WAVE '+W+'</h2><p>Score:'+S+'</p><button onclick=start()>PLAY AGAIN UNLIMITED</button>'}});requestAnimationFrame(loop)}</script></body></html>
